<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HYROX Log</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#131B20">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: phone app — sticky header + week strip, big cards first, small cards after, full-screen detail pages, bottom tab bar */
:root{
  --bg:#EEF1F2; --surface:#FFFFFF; --sunk:#E4E9EB; --line:#D3DADD;
  --ink:#131B20; --muted:#5C6970; --faint:#8A969C;
  --accent:#2447C9; --accent-soft:#E0E6FA; --on-accent:#FFFFFF;
  --hero:#131B20; --on-hero:#F2F5F6; --hero-muted:#9FB0B8;
  --good:#1E8A52; --good-soft:#DDF1E6; --warn:#B7700A; --warn-soft:#FBEBCF; --bad:#C23A2B; --bad-soft:#F8DEDA;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:14px; --nav:62px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1316; --surface:#172026; --sunk:#10181C; --line:#27333A;
  --ink:#E7EDEF; --muted:#9AA8AE; --faint:#6D7B82;
  --accent:#7D9BFF; --accent-soft:#1C2750; --on-accent:#0B1230;
  --hero:#E7EDEF; --on-hero:#0E1316; --hero-muted:#51616A;
  --good:#4CC486; --good-soft:#15301F; --warn:#E6A63C; --warn-soft:#33260E; --bad:#F07A6B; --bad-soft:#3A1B17;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1316; --surface:#172026; --sunk:#10181C; --line:#27333A;
  --ink:#E7EDEF; --muted:#9AA8AE; --faint:#6D7B82;
  --accent:#7D9BFF; --accent-soft:#1C2750; --on-accent:#0B1230;
  --hero:#E7EDEF; --on-hero:#0E1316; --hero-muted:#51616A;
  --good:#4CC486; --good-soft:#15301F; --warn:#E6A63C; --warn-soft:#33260E; --bad:#F07A6B; --bad-soft:#3A1B17;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-tap-highlight-color:transparent}body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;margin:0}
::placeholder{color:var(--faint);opacity:.8}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:10px calc(var(--nav) + 90px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.app>*{min-width:0}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:30px;line-height:1.02}
h2{font-size:22px;line-height:1.1}
h3{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}.stack>*{min-width:0}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.top .eyebrow{font:600 13px var(--f-display);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.race{flex:none;text-align:right}
.race .v{font:700 30px/1 var(--f-display)}
.race .l{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.strip{display:grid;grid-template-columns:28px repeat(7,minmax(0,1fr)) 28px;gap:4px;align-items:stretch}
.strip .nav{border:0;background:transparent;color:var(--muted);font-size:20px}
.dayb{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.dayb .d{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.dayb .n{font:700 19px/1 var(--f-display)}
.dayb .dot{width:6px;height:6px;border-radius:50%;background:transparent}
.dayb.full .dot{background:var(--good)}.dayb.part .dot{background:var(--warn)}.dayb.miss .dot{background:var(--bad)}
.dayb.today{border-color:var(--accent)}
.dayb.sel{background:var(--ink);border-color:var(--ink)}
.dayb.sel .d,.dayb.sel .n{color:var(--bg)}
.next{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.ring{flex:none;position:relative;width:52px;height:52px}
.ring svg{display:block}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;font:700 16px var(--f-display)}
.next .k{font:600 12px var(--f-display);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.next .v{font-weight:600}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0;text-align:left;width:100%}
button.card{cursor:pointer}
button.card:active{transform:scale(.995)}
.big{padding:16px}
.big .ttl{font:700 26px/1.05 var(--f-display)}
.card .lbl{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .lbl span:first-child{font:600 13px var(--f-display);text-transform:uppercase;letter-spacing:.09em}
.hero{background:var(--hero);color:var(--on-hero);border-color:var(--hero)}
.hero .muted{color:var(--hero-muted)}
.hero .bar{background:color-mix(in srgb,var(--on-hero) 18%,transparent)}
.food{background:var(--accent-soft);border-color:transparent}
.card.done{opacity:.72}
.check{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--good);color:#fff;font-weight:700;font-size:14px}
.go{color:var(--muted);font-size:18px}
.bar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.hero .bar i{background:var(--on-hero)}
.bar.good i{background:var(--good)}
.chips3{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.acc{background:var(--accent-soft);color:var(--accent)}
.hero .pill{background:color-mix(in srgb,var(--on-hero) 14%,transparent);color:var(--on-hero)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sm{padding:12px;gap:6px}
.sm .t{font-weight:600;line-height:1.25}
.sm .lbl span:first-child{font-size:12px}
.spark{display:block;width:100%;height:46px}
.alert{background:var(--bad-soft);color:var(--ink);border-radius:10px;padding:8px 10px;font-size:14px}
.alert.warn{background:var(--warn-soft)}
.alert.good{background:var(--good-soft)}

/* detail page */
.pagehead{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);display:flex;align-items:center;gap:8px;padding-block:6px}
.back{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-weight:600}
.pagehead .pt{font:700 20px var(--f-display);text-transform:uppercase;letter-spacing:.06em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.meta b{font:600 12px var(--f-display);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-right:4px}
.tick{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.tick:first-child{border-top:0}
.box{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--faint);display:grid;place-items:center;font-weight:700;font-size:14px;color:transparent;margin-top:1px}
.on>.box,.box.on{background:var(--good);border-color:var(--good);color:#fff}
.tick .tx{flex:1;min-width:0}
.tick .tx b{font-weight:600}
.tick .tx .sd{color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums;margin-left:4px}
.on .tx b{text-decoration:line-through;text-decoration-color:var(--faint)}
.bigbtn{width:100%;border:0;border-radius:12px;padding:13px 16px;font:700 17px var(--f-display);letter-spacing:.05em;text-transform:uppercase;background:var(--accent);color:var(--on-accent)}
.bigbtn.ok{background:var(--good);color:#fff}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:600;font-size:14px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.danger.arm{background:var(--bad);color:#fff;border-color:var(--bad)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;min-width:0}
input,select,textarea{font:500 16px var(--f-body);color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
input[type=range]{padding:0;accent-color:var(--accent);background:transparent;border:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
/* exercise */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px}
.ex.done{border-color:var(--good)}
.exh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.exh .nm{font-weight:600;font-size:16px}
.exh .rx{font:700 22px/1 var(--f-display);white-space:nowrap}
.srow{display:grid;grid-template-columns:18px minmax(0,1fr) 12px minmax(0,1fr) 44px;gap:6px;align-items:center}
.srow .i{font:600 12px var(--f-mono);color:var(--faint);text-align:center}
.srow input{text-align:center;padding:8px 4px;font-size:17px;font-weight:600}
.srow input.sugg{color:var(--muted);font-weight:500}
.srow .x{color:var(--faint);text-align:center}
.sbtn{width:44px;height:40px;border-radius:10px;border:2px solid var(--line);background:var(--sunk);font-weight:700;font-size:18px;color:var(--faint)}
.sbtn.on{background:var(--good);border-color:var(--good);color:#fff}
.howto summary{font-size:14px;color:var(--accent);font-weight:600;cursor:pointer}
.howto ul{margin:6px 0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px}
/* meals */
.meal{border-top:1px solid var(--line);padding:10px 0;display:flex;flex-direction:column;gap:8px}
.meal:first-child{border-top:0}
.mrow{display:grid;grid-template-columns:32px 46px minmax(0,1fr) auto;gap:8px;align-items:center}
.mrow .tm{font:600 16px var(--f-display);color:var(--muted)}
.mrow .nm{font-weight:600;line-height:1.25;background:none;border:0;padding:0;text-align:left}
.mrow .nm small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.mrow .kc{text-align:right;font:700 17px/1.1 var(--f-display)}
.mrow .kc small{display:block;font:500 12px var(--f-body);color:var(--muted)}
.meal.opt .nm{opacity:.8}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
td,th{padding:5px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font:600 12px var(--f-display);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
td.r,th.r{text-align:right;white-space:nowrap}
.tbl{overflow-x:auto}
.macro{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.macro .v{font:700 24px/1 var(--f-display)}
.macro .l{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.sheet{background:var(--sunk);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.opt-btn{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 10px}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
/* timer */
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + 12px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:12px;width:min(92vw,420px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.timer .tv{font:700 32px/1 var(--f-display);font-variant-numeric:tabular-nums;min-width:74px}
.timer .tl{flex:1;min-width:0;font-size:13px;line-height:1.25}
.timer button{background:color-mix(in srgb,var(--bg) 16%,transparent);border:0;color:var(--bg);border-radius:9px;padding:7px 10px;font-weight:600}
.timer.over{background:var(--good);color:#fff}
.net{position:sticky;top:0;z-index:25;background:var(--warn);color:#fff;text-align:center;font-size:13px;font-weight:600;padding:5px 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(40px + env(safe-area-inset-top,0px));z-index:30;background:var(--good);color:#fff;padding:7px 14px;border-radius:999px;font-size:14px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.toast.err{background:var(--bad)}
/* bottom nav */
nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabbar .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));height:var(--nav)}
nav.tabbar button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--muted);font-weight:600}
nav.tabbar button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabbar button[aria-current="page"]{color:var(--accent)}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .h{font:600 11px var(--f-display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center}
.cal button{aspect-ratio:1/1.1;border:1px solid var(--line);background:var(--surface);border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:2px;min-width:0}
.cal button .n{font:700 17px/1 var(--f-display)}
.cal button .k{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;max-width:100%;overflow:hidden;white-space:nowrap}
.cal button.full{background:var(--good-soft);border-color:var(--good)}
.cal button.part{background:var(--warn-soft);border-color:var(--warn)}
.cal button.miss{border-color:var(--bad)}
.cal button.today{outline:2px solid var(--accent);outline-offset:1px}
.cal button.empty{visibility:hidden}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
svg text{fill:var(--muted);font:11px var(--f-body)}
details.blk{border:1px solid var(--line);border-radius:10px;background:var(--sunk);padding:9px 11px}
details.blk>summary{cursor:pointer;font-weight:600;display:flex;justify-content:space-between;gap:8px;list-style:none}
details.blk>summary::-webkit-details-marker{display:none}
.empty{padding:14px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:14px}
@media (prefers-reduced-motion:no-preference){.card,.dayb,.sbtn,.box{transition:background-color .15s,border-color .15s,opacity .15s}}
</style>

</head><body>
<div class="net" id="net" hidden></div>
<div class="app" id="app"></div>
<div class="timer" id="timer" hidden><div class="tv num" id="tVal">1:30</div><div class="tl" id="tLbl">Dinlenme</div><button type="button" id="tPlus">+15 sn</button><button type="button" id="tStop">Bitir</button></div>
<div class="toast" id="toast" hidden></div>

sın.", "Pilavı R1'deki gibi yap (tereyağlı).", "Ayranı yerken ekle."], "min": 70}, "R6": {"cat": "Ana öğün", "name": "Ton balıklı mısırlı makarna", "items": [["makarna", 130], ["ton", 120], ["misir", 60], ["zyag", 10], ["yogurt", 100]], "how": ["Makarnayı haşla.", "Süzülmüş ton balığı, mısır, zeytinyağı, tuz, pul biber ile karıştır.", "Üstüne ya da yanına yoğurt. Tek porsiyon, taze yap (10 dk)."], "min": 12}, "R7": {"cat": "Ana öğün", "name": "Biberli tavuk sote + bulgur pilavı + yoğurt", "items": [["tgogus", 170], ["biber", 80], ["sogan", 50], ["domates", 120], ["zyag", 15], ["bulgur", 100], ["yogurt", 150]], "how": ["Tavuk göğsü şerit doğra. Geniş tavada 10 g zeytinyağında yüksek ateşte 5 dk.", "Soğan ve biberi ekle 4 dk, doğranmış domatesi ekle 5 dk. Tuz, karabiber, kekik, pul biber.", "Bulgur pilavı: kalan yağla bulguru kavur, 2 katı sıcak su, 15 dk + 10 dk demlendir.", "Kaplara böl. Yoğurdu yerken ekle."], "min": 40}, "R9": {"cat": "Ana öğün", "name": "Tavuk dürüm + mercimek çorbası + ayran", "items": [["lavas", 1], ["tgogus", 150], ["yogurt", 50], ["domates", 60], ["yesil", 30], ["zyag", 5], ["mercimek", 50], ["sogan", 30], ["tereyag", 5], ["ayran", 300]], "how": ["Çorba (2 porsiyon yap, birini Pazar'a sakla): mercimeği yıka; tereyağında soğanı 3 dk kavur, mercimek + 5 katı su, 20 dk pişir, blenderdan geçir, tuz, kimyon.", "Tavuk göğsü ince şerit, zeytinyağında yüksek ateşte 6–7 dk, tuz, kimyon, pul biber.", "Lavaşa yoğurt sür, tavuk, domates, yeşillik; sar. Dışarıda yersen tavuk dürüm + ayran benzer değerde."], "min": 30}}, "SESS": null}</script>
<script>
(function(){
"use strict";
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const LIB=JSON.parse(document.getElementById("lib").textContent);
const TR_DAYS=["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
const TR_D3=["Paz","Pzt","Sal","Çar","Per","Cum","Cmt"];
const TR_MON=["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
const TR_MONL=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const PROGRAM_START="2026-10-05";
const DEFAULTS={race:"2027-01-31",kcal:3400,protein:140,goal:70};

/* ---------- utils ---------- */
const pad=n=>String(n).padStart(2,"0");
const key=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=k=>{const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(k,n)=>{const d=parse(k);d.setDate(d.getDate()+n);return key(d)};
const monday=k=>{const d=parse(k);d.setDate(d.getDate()-((d.getDay()+6)%7));return key(d)};
const diffDays=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const nice=k=>{const d=parse(k);return d.getDate()+" "+TR_MON[d.getMonth()]};
const todayKey=()=>key(new Date());
const weekLabel=k=>{const n=Math.floor(diffDays(PROGRAM_START,monday(k))/7)+1;return n<1?"Giriş":"Hafta "+n};
const num=v=>{if(v===""||v==null)return null;const n=Number(String(v).replace(",","."));return isFinite(n)?n:null};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const R0=v=>Math.round(v||0);
const f1=v=>v==null?"–":(Math.round(v*10)/10).toFixed(1).replace(".",",");
const avg=a=>{a=a.filter(x=>x!=null);return a.length?a.reduce((s,x)=>s+x,0)/a.length:null};
const parseTime=s=>{if(!s)return null;s=String(s).trim();if(/^\d+([.,]\d+)?$/.test(s))return Number(s.replace(",","."))*60;const p=s.split(":").map(Number);if(p.some(isNaN))return null;if(p.length===2)return p[0]*60+p[1];if(p.length===3)return p[0]*3600+p[1]*60+p[2];return null};
const fmtPace=sec=>{if(!sec||!isFinite(sec))return "–";let m=Math.floor(sec/60),s=Math.round(sec%60);if(s===60){m++;s=0}return m+":"+pad(s)};
const firstNum=t=>{const m=String(t||"").match(/(\d+(?:[.,]\d+)?)/);return m?m[1].replace(",","."):""};
const clone=o=>JSON.parse(JSON.stringify(o||{}));
function toast(t,err){const el=$("#toast");el.textContent=t;el.className="toast"+(err?" err":"");el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,1500)}

/* ---------- library helpers ---------- */
function foodLine(fid,q,mult){
  const f=LIB.F[fid];if(!f)return {name:fid,amt:"",k:0,p:0,c:0,y:0};
  const [name,u,g,kc,pp,cc,ff]=f;const qty=q*(mult||1);const grams=qty*g;
  const rq=v=>{const r=Math.round(v*10)/10;return (r%1===0?r.toFixed(0):r.toFixed(1)).replace(".",",")};
  const amt=u==="g"?rq(qty)+" g":u==="ml"?rq(qty)+" ml":rq(qty)+" "+u+(g>1?` (≈${Math.round(grams)} g)`:"");
  return {name,amt,k:kc*grams/100,p:pp*grams/100,c:cc*grams/100,y:ff*grams/100};
}
function mealMacro(id,mult){const m=LIB.MEAL[id];const t={k:0,p:0,c:0,y:0};if(!m)return t;m.items.forEach(([f,q])=>{const l=foodLine(f,q,mult);t.k+=l.k;t.p+=l.p;t.c+=l.c;t.y+=l.y});return t}
function planMacro(p){const t={k:0,p:0};(p&&p.meals||[]).forEach(m=>{if(m.opt)return;const x=mealMacro(m.id);t.k+=x.k;t.p+=x.p});return t}
function eaten(p,d){const t={k:0,p:0,n:0,of:0};const ms=(d.meals)||{};
  (p&&p.meals||[]).forEach((m,i)=>{const s=ms[i]||{};if(!m.opt&&m.slot!=="Yan")t.of++;if(!s.done)return;if(!m.opt&&m.slot!=="Yan")t.n++;
    if(s.custom){t.k+=num(s.custom.k)||0;t.p+=num(s.custom.p)||0}else{const x=mealMacro(s.alt||m.id);t.k+=x.k;t.p+=x.p}});
  (d.extraFood||[]).forEach(e=>{t.k+=num(e.k)||0;t.p+=num(e.p)||0});
  return t}
function routineOf(id){return LIB.MOB[id]||LIB.WARM[id]||LIB.COOL[id]||null}

/* ---------- store (Supabase RPC + offline queue) ---------- */
const CFG={url:"https://ywyrzrajknscojrbwbks.supabase.co",anon:"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl3eXJ6cmFqa25zY29qcmJ3YmtzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2NDU5NDIsImV4cCI6MjA5MDIyMTk0Mn0.f_UXwnvzBA0f5IrTF8UWWREY8IG9rKKwELy8DXk-yhY"};
const PLAN=(()=>{try{return JSON.parse(document.getElementById("plan").textContent)}catch(e){return {}}})();
const S={days:{},plan:{...PLAN},planOv:{},tests:{},settings:{...DEFAULTS},mode:"sync",online:navigator.onLine};
const LS="hx-cache-v1",LQ="hx-queue-v1",LK="hx-key",LL="hx-local";
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let KEY=null;
(function initKey(){
  const m=location.hash.match(/k=([A-Za-z0-9_-]{24,})/);
  if(m){try{localStorage.setItem(LK,m[1])}catch(e){}history.replaceState(null,"",location.pathname+location.search)}
  try{KEY=localStorage.getItem(LK)}catch(e){}
  if(!KEY&&lsGet(LL,false))S.mode="local";
})();
function lsLoad(){const r=lsGet(LS,null);if(r){S.days=r.days||{};S.tests=r.tests||{};S.planOv=r.planOv||{};S.settings={...DEFAULTS,...(r.settings||{})};S.plan={...PLAN,...S.planOv}}}
function lsSave(){lsSet(LS,{days:S.days,tests:S.tests,settings:S.settings,planOv:S.planOv})}
function rpc(name,body){return fetch(CFG.url+"/rest/v1/rpc/"+name,{method:"POST",headers:{apikey:CFG.anon,Authorization:"Bearer "+CFG.anon,"Content-Type":"application/json"},body:JSON.stringify(body),cache:"no-store"})
  .then(r=>{if(!r.ok)return r.text().then(t=>{throw new Error(t||("HTTP "+r.status))});return r.status===204?null:r.json()})}
function queue(){return lsGet(LQ,[])}
function enqueue(op){const q=queue().filter(o=>!(o.coll===op.coll&&o.id===op.id));q.push(op);lsSet(LQ,q)}
let flushing=null;
function flushQueue(){
  if(S.mode!=="sync"||!KEY)return Promise.resolve("local");
  if(flushing)return flushing.then(()=>flushQueue());
  flushing=(async()=>{let q=queue();
    while(q.length){const op=q[0];
      try{if(op.del)await rpc("hyrox_del",{p_key:KEY,p_coll:op.coll,p_id:op.id});else await rpc("hyrox_put",{p_key:KEY,p_coll:op.coll,p_id:op.id,p_data:op.data});}
      catch(e){S.online=false;updateNet();return "queued"}
      q=queue();const i=q.findIndex(o=>o.coll===op.coll&&o.id===op.id&&o.t===op.t);if(i>=0){q.splice(i,1);lsSet(LQ,q)}else q=queue();
    }
    S.online=true;updateNet();return "synced"})().finally(()=>{flushing=null});
  return flushing;
}
function applyLocal(coll,id,data){if(coll==="settings"){S.settings={...DEFAULTS,...(data||{})};return}
  if(coll==="plan"){if(data)S.planOv[id]=data;else delete S.planOv[id];S.plan={...PLAN,...S.planOv};return}
  if(data)S[coll][id]=data;else delete S[coll][id]}
function write(coll,id,data){applyLocal(coll,id,clone(data));lsSave();enqueue({coll,id,data:clone(data),t:Date.now()});return flushQueue()}
function remove(coll,id){applyLocal(coll,id,null);lsSave();enqueue({coll,id,del:true,t:Date.now()});return flushQueue()}
async function pull(){
  if(S.mode!=="sync"||!KEY)return;
  await flushQueue();
  let rows;try{rows=await rpc("hyrox_pull",{p_key:KEY})}catch(e){S.online=false;updateNet();return}
  S.online=true;updateNet();
  const days={},tests={},planOv={};let settings=null;
  (rows||[]).forEach(r=>{if(r.coll==="days")days[r.id]=r.data;else if(r.coll==="tests")tests[r.id]=r.data;else if(r.coll==="plan")planOv[r.id]=r.data;else if(r.coll==="settings"&&r.id==="main")settings=r.data});
  S.days=days;S.tests=tests;S.planOv=planOv;S.plan={...PLAN,...planOv};S.settings={...DEFAULTS,...(settings||{})};
  queue().forEach(op=>applyLocal(op.coll,op.id,op.del?null:op.data));
  lsSave();softRender();
}
function updateNet(){const el=document.getElementById("net");if(!el)return;const q=queue().length;
  el.hidden=S.mode!=="sync"||(S.online&&!q);el.textContent=S.online?(q?`${q} kayıt gönderiliyor…`:""):`Çevrimdışı · ${q} kayıt telefonda bekliyor`}

/* ---------- state ---------- */
let sel=todayKey(), view="home", sub=null, calMonth=todayKey().slice(0,7), dirty=false, saveT=null, draft={};
let openMeal=null, altOpen=null;
function loadDraft(){draft=clone(S.days[sel]||{});}
function plan(){return S.plan[sel]||null}
function isEmptyDay(d){return !Object.keys(d).filter(k=>!["date","updated","kcal","protein"].includes(k)).length}
function derive(d){const p=S.plan[d.date];const e=eaten(p,d);if(e.k>0){d.kcal=R0(e.k);d.protein=R0(e.p)}else{delete d.kcal;delete d.protein}}
function commit(delay=250){dirty=true;clearTimeout(saveT);saveT=setTimeout(flush,delay)}
function flush(){if(!dirty)return;clearTimeout(saveT);dirty=false;const date=sel;const d=clone(draft);d.date=date;derive(d);d.updated=new Date().toISOString();
  if(isEmptyDay(d)){if(S.days[date])remove("days",date).then(()=>toast("Silindi"));return}
  write("days",date,d).then(r=>toast(r==="queued"?"Telefona kaydedildi · internet gelince gönderilir":"Kaydedildi ✓"));}
function setSel(k){flush();sel=k;loadDraft();openMeal=null;altOpen=null}

/* ---------- completion ---------- */
function status(k){
  const p=S.plan[k],d=(k===sel?draft:S.days[k])||{};const items=[];
  if(p){
    if(p.morning)items.push(["Sabah rutini",!!(d.morning&&d.morning.done)]);
    items.push(["Kilo / uyku",num(d.weight)!=null||num(d.sleep)!=null]);
    if(p.session)items.push(["Antrenman",!!(d.session&&d.session.status)]);
    if(p.run)items.push([p.run.test?"Test":"Koşu",!!(d.run&&(num(d.run.km)>0||d.run.status))]);
    const e=eaten(p,d);items.push(["Beslenme",e.of>0&&e.n>=e.of]);
    items.push(["Akşam mobility",!!(d.mob&&d.mob.done)]);
    if(p.prep)items.push(["Meal prep",!!d.prepDone]);
  }else{items.push(["Kilo / uyku",num(d.weight)!=null||num(d.sleep)!=null])}
  const done=items.filter(i=>i[1]).length;return {items,done,total:items.length,ratio:items.length?done/items.length:0};
}
function dayClass(k){const st=status(k);const t=todayKey();if(st.done===0)return (k<t&&S.plan[k])?"miss":"";return st.ratio>=.99?"full":"part"}

/* ---------- navigation ---------- */
function go(v,s){flush();view=v;sub=s||null;window.scrollTo(0,0);render();$$("nav.tabbar button").forEach(b=>b.setAttribute("aria-current",b.dataset.nav===v?"page":"false"))}
$$("nav.tabbar button").forEach(b=>b.onclick=()=>go(b.dataset.nav));

/* ---------- render root ---------- */
function render(){
  const app=$("#app");
  if(S.mode==="sync"&&!KEY){app.innerHTML=renderSetup();return}
  if(view==="home")app.innerHTML=sub?renderSub():renderHome();
  else if(view==="cal")app.innerHTML=renderCal();
  else if(view==="prog"){app.innerHTML=renderProg();drawProg()}
  else if(view==="guide")app.innerHTML=renderGuide();
  else if(view==="set")app.innerHTML=renderSet();
}
function softRender(){if(dirty)return;const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;loadDraft();render()}

/* ---------- HOME ---------- */
function ringSVG(r){const C=2*Math.PI*22;return `<svg width="52" height="52" viewBox="0 0 52 52"><circle cx="26" cy="26" r="22" stroke="var(--sunk)" stroke-width="6" fill="none"/><circle cx="26" cy="26" r="22" stroke="var(--good)" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="${(C*r).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 26 26)"/></svg>`}
function nextItem(){
  const p=plan();if(!p)return null;const d=draft;const list=[];
  if(p.morning&&!(d.morning&&d.morning.done))list.push({t:"07:00",txt:"Sabah rutini",s:"morning"});
  (p.meals||[]).forEach((m,i)=>{if(m.opt||m.slot==="Yan")return;if(!(d.meals&&d.meals[i]&&d.meals[i].done)){const x=LIB.MEAL[(d.meals&&d.meals[i]&&d.meals[i].alt)||m.id];list.push({t:m.time,txt:m.slot+": "+(x?x.name:""),s:"food"})}});
  if(p.session&&!(d.session&&d.session.status))list.push({t:p.session.time,txt:"Antrenman: "+p.title,s:"train"});
  if(p.run&&!(d.run&&(num(d.run.km)>0||d.run.status)))list.push({t:p.run.time,txt:(p.run.test?"Test: ":"Koşu: ")+p.run.km+" km",s:"run"});
  if(!(d.mob&&d.mob.done))list.push({t:"21:30",txt:"Akşam mobility",s:"mob"});
  list.sort((a,b)=>a.t.localeCompare(b.t));
  if(sel!==todayKey())return list[0]||null;
  const now=new Date();const nm=pad(now.getHours())+":"+pad(now.getMinutes());
  const later=list.filter(i=>{const [h,m]=i.t.split(":").map(Number);return (h*60+m)>=(now.getHours()*60+now.getMinutes()-60)});
  return later[0]||list[0]||null;
}
function renderHome(){
  const p=plan(),d=draft,t=todayKey();const dd=parse(sel);
  const race=S.settings.race||DEFAULTS.race;const wks=Math.max(0,Math.ceil(diffDays(t,race)/7));
  const m=monday(sel);
  let h=`<header class="top"><div><div class="eyebrow">${TR_DAYS[dd.getDay()]} ${nice(sel)}${sel===t?" · bugün":""} · ${esc(p?p.week:weekLabel(sel))}</div><h1>${esc(p?p.title:"Plan yok")}</h1></div>
    <div class="race"><div class="v num">${wks}</div><div class="l">hafta<br>yarışa</div></div></header>`;

  // small cards

  if(p)sm.push(smallCard("mob","Akşam mobility",routineOf(p.mob).name+" · "+routineOf(p.mob).min+" dk",d.mob&&d.mob.done));

}
function smallCard(s,title,txt,done){return `<button type="button" class="card sm ${done?"done":""}" data-sub="${s}"><div class="lbl"><span>${esc(title)}</span>${done?'<span class="check">✓</span>':'<span class="go">›</span>'}</div><div class="t small">${esc(txt)}</div></button>`}
function trainProgress(p,d){let tot=0,dn=0;(p.session.blocks||[]).forEach(b=>{const e=LIB.EX[b.ex];const n=Number(b.sets)||0;tot+=n;const l=(d.lifts||[]).find(x=>e&&x.name===e.name);if(l)dn+=Math.min(n,l.sets.filter(s=>s.done).length)});
  const f=p.session.finisher;if(f){tot+=f.rounds;dn+=((d.finisher&&d.finisher.rounds)||[]).filter(Boolean).length}return {tot,dn}}

   <div class="row" style="align-items:baseline;gap:14px"><span class="ttl num">${esc(r.km)} km</span><span class="small ${p.session?"muted":"muted"}">RPE ${esc(r.rpe)} · ${esc(r.pace)} /km</span></div>
   <div class="small muted">${esc(r.title)}${r.strides?" + strides":""}</div>
   ${done?`<div class="small">Kaydedilen: ${esc(d.run.km||"–")} km${d.run.pace?" · "+fmtPace(d.run.pace)+" /km":""}${d.run.rpe?" · RPE "+esc(d.run.rpe):""}</div>`:""}</button>`}
function foodCard(p,d){const e=eaten(p,d);const pm=planMacro(p);const tk=S.settings.kcal||3400;
  const nxi=(p.meals||[]).findIndex((m,i)=>!m.opt&&m.slot!=="Yan"&&!(d.meals&&d.meals[i]&&d.meals[i].done));

   ${nm?`<div class="small muted">Sıradaki · ${esc(nm.time)} · ${esc(nm.slot)}</div><div class="ttl" style="font-size:22px">${esc(nmd?nmd.name:"")}</div>`:`<div class="ttl" style="font-size:22px">Bugünkü öğünler tamam</div>`}

function sparkline(){const t=sel;const pts=[];for(let i=13;i>=0;i--){const k=addDays(t,-i);const v=num((k===sel?draft:S.days[k]||{}).weight);if(v!=null)pts.push([13-i,v])}
  if(pts.length<2)return `<div class="small muted">Grafik için en az 2 sabah tartısı gerekiyor.</div>`;
  const ys=pts.map(p=>p[1]);let y0=Math.min(...ys),y1=Math.max(...ys);if(y1-y0<0.6){const c=(y0+y1)/2;y0=c-.3;y1=c+.3}
  const X=x=>4+x/13*292,Y=y=>40-(y-y0)/(y1-y0)*34;const dpath=pts.map((p,i)=>(i?"L":"M")+X(p[0]).toFixed(1)+","+Y(p[1]).toFixed(1)).join("");const e=pts[pts.length-1];

/* training */
function suggest(exName,idx,b){
  const l=(draft.lifts||[]).find(x=>x.name===exName);const cur=l&&l.sets[idx];
  let kg=cur&&cur.kg!=null&&cur.kg!==""?cur.kg:null,reps=cur&&cur.reps!=null&&cur.reps!==""?cur.reps:null;
  const last=lastLift(exName,sel);const ls=last&&(last.sets[idx]||last.sets[last.sets.length-1]);
  return {kg:kg??(ls&&ls.kg)??firstNum(b.load),reps:reps??firstNum(b.reps),sugKg:kg==null,sugReps:reps==null};
}
function lastLift(name,before){const ks=Object.keys(S.days).filter(k=>k<before).sort().reverse();
  for(const k of ks){const l=(S.days[k].lifts||[]).find(x=>x.name===name);if(l&&l.sets.some(s=>s.done||num(s.kg)!=null))return {date:k,sets:l.sets.filter(s=>s.done||num(s.kg)!=null)}}return null}

    rows+=`<div class="srow"><span class="i">${s+1}</span><input id="kg-${i}-${s}" class="${v.sugKg&&!on?"sugg":""}" inputmode="decimal" aria-label="${esc(e.name)} set ${s+1} kilo" data-set="${esc(e.name)}|${s}|kg" value="${esc(v.kg)}"><span class="x">×</span><input id="rp-${i}-${s}" class="${v.sugReps&&!on?"sugg":""}" inputmode="numeric" aria-label="${esc(e.name)} set ${s+1} tekrar" data-set="${esc(e.name)}|${s}|reps" value="${esc(v.reps)}"><button type="button" class="sbtn ${on?"on":""}" data-done="${esc(e.name)}|${s}|${i}" aria-label="Set ${s+1} tamam">✓</button></div>`}
  return `<div class="ex ${doneN>=n?"done":""}"><div class="exh"><div style="min-width:0"><div class="nm">${i+1}. ${esc(e.name)}</div><div class="small muted">${b.rir&&b.rir!=="–"?"RIR "+esc(b.rir)+" · ":""}dinlenme ${e.rest>=120?(e.rest/60+" dk").replace(".",","):e.rest+" sn"} · ${esc(b.load)}</div></div><div class="exh rx">${esc(b.sets)}×${esc(b.reps)}</div></div>
    <div class="tiny muted">${last?"Son sefer ("+nice(last.date)+"): "+last.sets.map(s=>(s.kg||"–")+"×"+(s.reps||"–")).join(", "):"İlk kez yapıyorsun. Kutudaki kilo başlangıç önerisi, gerekirse değiştir."}</div>
    ${rows}<div class="row between"><details class="howto"><summary>Nasıl yapılır</summary><ul>${(e.cues||[]).map(c=>`<li>${esc(c)}</li>`).join("")}</ul><div class="small"><b>Alternatif:</b> ${esc(e.alt||"–")}</div></details><button type="button" class="btn ghost" data-addset="${esc(e.name)}|${cnt}">+ set</button></div></div>`;
}

/* food */
function mealBlock(p,m,i){

/* ---------- week ---------- */
function weekSum(m){
  const ds=[];for(let i=0;i<7;i++){const k=addDays(m,i);ds.push({k,d:(k===sel?draft:S.days[k])||{},p:S.plan[k]})}
  const km=ds.reduce((s,x)=>s+(num(x.d.run&&x.d.run.km)||0),0);
  const planned=ds.filter(x=>x.p&&(x.p.session||x.p.run)).length;
  const done=ds.filter(x=>(x.d.session&&x.d.session.status==="Tamamlandı")||(x.d.run&&num(x.d.run.km)>0)).length;
  const wN=ds.filter(x=>num(x.d.weight)!=null).length;
  return {ds,km,planned,done,wN,wAvg:avg(ds.map(x=>num(x.d.weight))),sleep:avg(ds.map(x=>num(x.d.sleep))),energy:avg(ds.map(x=>num(x.d.energy))),
    fb:ds.filter(x=>x.d.football&&x.d.football.played).length,pS:Math.max(0,...ds.map(x=>num(x.d.pShoulder)||0)),pB:Math.max(0,...ds.map(x=>num(x.d.pBack)||0)),pL:Math.max(0,...ds.map(x=>num(x.d.pLeg)||0)),
    kcal:avg(ds.map(x=>num(x.d.kcal))),protein:avg(ds.map(x=>num(x.d.protein))),creatine:ds.filter(x=>x.d.creatine).length,mob:ds.filter(x=>x.d.mob&&x.d.mob.done).length,
    planKm:ds.reduce((s,x)=>s+(num(x.p&&x.p.run&&x.p.run.km)||0),0)};
}
function flagsFor(w,prev){const f=[];
  if(prev.km>0&&w.km>prev.km*1.2)f.push(["warn",`Koşu hacmi hızlı arttı: ${f1(prev.km)} → ${f1(w.km)} km. Gelecek hafta sabit tut.`]);
  if(w.wN>=3&&prev.wN>=3){const d=w.wAvg-prev.wAvg;if(d<0.1)f.push(["warn",`Kilo artmıyor (${d>=0?"+":""}${d.toFixed(2)} kg). Gece öğününü ekle (+~300 kcal).`]);else if(d>0.6)f.push(["warn",`Kilo hızlı arttı (+${d.toFixed(2)} kg). Bir hafta daha izle.`]);else f.push(["good",`Kilo hedefte: +${d.toFixed(2)} kg / hafta.`])}
  if(w.sleep!=null&&w.sleep<7)f.push(["warn",`Uyku ortalaması ${f1(w.sleep)} saat. 7+ hedef.`]);
  if(w.energy!=null&&w.energy<=2.5)f.push(["bad",`Enerji ortalaması ${f1(w.energy)}. Hacim eklenmemeli.`]);
  if(w.pS>=5)f.push(["bad",`Omuz ağrısı ${w.pS}/10. Pres hareketlerini bırak, Claude'a yaz.`]);else if(w.pS>=3)f.push(["warn",`Omuz ${w.pS}/10: pres hacmini azalt.`]);
  if(w.pB>=5)f.push(["bad",`Bel/kalça ${w.pB}/10. Hinge hareketlerini hafiflet.`]);else if(w.pB>=3)f.push(["warn",`Bel/kalça ${w.pB}/10: RDL ve squat'ta ağırlığı artırma.`]);
  if(w.pL>=4)f.push(["bad",`Baldır/aşil/shin ${w.pL}/10. 2 gün koşma, yerine bisiklet.`]);
  if(w.protein!=null&&w.protein<(S.settings.protein||140)-15)f.push(["warn",`Protein ortalaması ${R0(w.protein)} g.`]);
  if(!f.length)f.push(["good","Uyarı yok. Veri girdikçe burası dolar."]);return f}
function report(m,w,prev){const L=[`HAFTALIK RAPOR · ${weekLabel(m)} (${nice(m)}–${nice(addDays(m,6))})`,
  `Kilo ort: ${w.wAvg==null?"–":f1(w.wAvg)} kg (${w.wN} ölçüm)${prev.wAvg!=null&&w.wAvg!=null?`, önceki hafta ${f1(prev.wAvg)}`:""}`,
  `Uyku ort: ${f1(w.sleep)} sa · Enerji ort: ${f1(w.energy)}/5`,
  `Koşu: ${f1(w.km)} km (plan ${f1(w.planKm)}) · Antrenman: ${w.done}/${w.planned} · Halı saha: ${w.fb}`,
  `Max ağrı omuz/bel/bacak: ${w.pS}/${w.pB}/${w.pL}`,
  `Beslenme ort: ${w.kcal==null?"–":R0(w.kcal)} kcal, ${w.protein==null?"–":R0(w.protein)} g protein · Kreatin ${w.creatine}/7 · Mobility ${w.mob}/7`,"","GÜNLER"];
  w.ds.forEach(x=>{const d=x.d;if(isEmptyDay(d)&&!x.p)return;const parts=[`${TR_D3[parse(x.k).getDay()]} ${nice(x.k)}: ${x.p?x.p.title:"plansız"} → ${d.session&&d.session.status||(d.run&&d.run.km?"koşu yapıldı":"girilmedi")}`];
    if(d.session&&d.session.rpe)parts.push("RPE "+d.session.rpe);
    if(d.run&&d.run.km)parts.push(`koşu ${d.run.km} km${d.run.pace?" @"+fmtPace(d.run.pace):""}${d.run.rpe?" RPE "+d.run.rpe:""}`);
    if(d.football&&d.football.played)parts.push(`halı saha ${d.football.min||"?"} dk`);
    (d.lifts||[]).forEach(l=>{const s=l.sets.filter(s=>s.done);if(s.length)parts.push(`${l.name} ${s.map(s=>(s.kg||"-")+"x"+(s.reps||"-")).join(",")}`)});
    if(d.finisher&&d.finisher.note)parts.push("finisher: "+d.finisher.note);
    if(d.painnote)parts.push("ağrı: "+d.painnote);if(d.note)parts.push("not: "+d.note);L.push("- "+parts.join(" · "))});
  return L.join("\n")}

function chart(el,series,opt={}){
  const W=680,H=opt.h||200,P={l:40,r:12,t:12,b:26};const all=series.flatMap(s=>s.pts);
  if(all.length<(opt.min||2)){el.innerHTML=`<div class="empty">${esc(opt.empty||"Grafik için en az 2 kayıt gerekiyor.")}</div>`;return}
  let x0=Math.min(...all.map(p=>p.x)),x1=Math.max(...all.map(p=>p.x));if(x0===x1){x0-=1;x1+=1}
  let y0=opt.y0!=null?opt.y0:Math.min(...all.map(p=>p.y)),y1=Math.max(...all.map(p=>p.y));if(y0===y1){y0-=1;y1+=1}const pd=(y1-y0)*.12;if(opt.y0==null)y0-=pd;y1+=pd;
  const X=x=>P.l+(x-x0)/(x1-x0)*(W-P.l-P.r),Y=y=>H-P.b-(y-y0)/(y1-y0)*(H-P.t-P.b);
  let g="";for(let i=0;i<=4;i++){const v=y0+(y1-y0)*i/4;g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${P.l-6}" y="${Y(v)+4}" text-anchor="end">${opt.fy?opt.fy(v):v.toFixed(1)}</text>`}
  g+=(opt.xl||[]).map(l=>`<text x="${X(l.x)}" y="${H-8}" text-anchor="middle">${esc(l.t)}</text>`).join("");
  let b="";series.forEach(s=>{if(s.bars){const bw=Math.max(8,(W-P.l-P.r)/(s.pts.length+1)*.6);b+=s.pts.map(p=>`<rect x="${X(p.x)-bw/2}" y="${Y(p.y)}" width="${bw}" height="${Math.max(0,Y(y0)-Y(p.y))}" rx="3" fill="${s.color}"/>`).join("");return}
    const pts=s.pts.slice().sort((a,b)=>a.x-b.x);if(s.dots)b+=pts.map(p=>`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="3" fill="${s.color}"/>`).join("");
    if(s.line&&pts.length>1){const d=pts.map((p,i)=>(i?"L":"M")+X(p.x).toFixed(1)+","+Y(p.y).toFixed(1)).join("");b+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round"/>`;const e=pts[pts.length-1];b+=`<circle cx="${X(e.x)}" cy="${Y(e.y)}" r="4.5" fill="${s.color}"/>`}});
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(opt.label||"grafik")}">${g}${b}</svg>`}
function drawProg(){

  const ma=wk.map(k=>{const v=[];for(let i=0;i<7;i++){const d=S.days[addDays(k,-i)];if(d&&num(d.weight)!=null)v.push(num(d.weight))}return {x:diffDays(start,k),y:avg(v)}});
  chart($("#chWeight"),[{pts:wk.map(k=>({x:diffDays(start,k),y:num(S.days[k].weight)})),dots:true,color:"var(--faint)"},{pts:ma,line:true,color:"var(--accent)"}],{xl:[0,28,56,83].map(x=>({x,t:nice(addDays(start,x))})),label:"Kilo",empty:"En az 2 sabah tartısı gir."});
  $("#wSum").textContent=wk.length?`Son ${String(S.days[wk[wk.length-1]].weight).replace(".",",")} kg · hedef ${S.settings.goal} kg`:"";
  const m=monday(t),bars=[],xl=[];for(let i=9;i>=0;i--){const wm=addDays(m,-7*i);let km=0;for(let j=0;j<7;j++){const d=S.days[addDays(wm,j)];km+=num(d&&d.run&&d.run.km)||0}bars.push({x:9-i,y:km});if(i%3===0)xl.push({x:9-i,t:nice(wm)})}
  chart($("#chKm"),[{pts:bars,bars:true,color:"var(--accent)"}],{y0:0,xl,min:1,fy:v=>v.toFixed(0),label:"Haftalık km",h:170});
  const pk=Object.keys(S.days).filter(k=>{const r=S.days[k].run;return r&&r.pace&&num(r.rpe)!=null&&num(r.rpe)<=4}).sort();
  const pp=pk.map(k=>({x:diffDays(pk[0],k),y:S.days[k].run.pace}));
  chart($("#chPace"),[{pts:pp,line:true,dots:true,color:"var(--good)"}],{xl:pk.length?[{x:0,t:nice(pk[0])},{x:pp[pp.length-1].x,t:nice(pk[pk.length-1])}]:[],fy:v=>fmtPace(v),label:"Easy pace",empty:"RPE 4 ve altı en az 2 koşu girince görünür."});
  const names=new Set();Object.values(S.days).forEach(d=>(d.lifts||[]).forEach(l=>{if(l.sets.some(s=>s.done&&num(s.kg)))names.add(l.name)}));
  const arr=[...names].sort((a,b)=>a.localeCompare(b,"tr"));const sl=$("#liftSel");sl.innerHTML=arr.length?arr.map(n=>`<option>${esc(n)}</option>`).join(""):"<option>Henüz kayıt yok</option>";
  sl.onchange=drawLift;drawLift();drawBench();
}
function drawLift(){const name=$("#liftSel").value;const rows=[];
  Object.keys(S.days).sort().forEach(k=>{const l=(S.days[k].lifts||[]).find(x=>x.name===name);if(!l)return;let best=null;l.sets.forEach(s=>{const kg=num(s.kg),r=num(s.reps);if(s.done&&kg&&r){const e=kg*(1+r/30);if(!best||e>best.e)best={e,kg,r}}});if(best)rows.push({k,...best})});
  if(!rows.length){$("#chLift").innerHTML=`<div class="empty">Setleri ✓'ledikçe dolar. Tahmini 1RM (Epley) gösterilir.</div>`;$("#liftTxt").textContent="";return}
  const pts=rows.map(r=>({x:diffDays(rows[0].k,r.k),y:r.e}));chart($("#chLift"),[{pts,line:true,dots:true,color:"var(--accent)"}],{xl:[{x:0,t:nice(rows[0].k)},{x:pts[pts.length-1].x,t:nice(rows[rows.length-1].k)}],min:1,label:"Tahmini 1RM"});
  const b=rows[rows.length-1];$("#liftTxt").textContent=`Son en iyi set: ${b.kg} kg × ${b.r} (${nice(b.k)}) · tahmini 1RM ${f1(b.e)} kg`}

  const el=e.target;const ds=el.dataset;
  if(ds.set){const [name,s,k]=ds.set.split("|");const l=lift(name);const i=Number(s);while(l.sets.length<=i)l.sets.push({});l.sets[i][k]=el.value;el.classList.remove("sugg");commit(800);return}
  if(ds.sess){draft.session=draft.session||{};draft.session[ds.sess]=el.value;commit(800);return}
  if(ds.fin){draft.finisher=draft.finisher||{};draft.finisher.note=el.value;commit(800);return}
  if(ds.run){draft.run=draft.run||{};draft.run[ds.run]=el.value;const km=num(draft.run.km),t=parseTime(draft.run.time);if(km&&t)draft.run.pace=Math.round(t/km);else delete draft.run.pace;const po=$("#paceOut");if(po)po.textContent=km&&t?fmtPace(t/km):"–";commit(800);return}
  if(ds.f){if(el.value==="")delete draft[ds.f];else draft[ds.f]=el.value;commit(800);return}
  if(ds.range){draft[ds.range]=Number(el.value);if(!draft[ds.range])delete draft[ds.range];const o=$("#o-"+ds.range);if(o)o.textContent=el.value;commit(600);return}
  if(ds.fbf){draft.football=draft.football||{};draft.football[ds.fbf]=el.value;commit(800);return}
});
document.addEventListener("change",e=>{if(e.target.id==="importFile")doImport(e.target.files[0])});

/* ---------- timer ---------- */
let tEnd=0,tInt=null;
function startTimer(sec,label){tEnd=Date.now()+sec*1000;$("#tLbl").textContent=label;const t=$("#timer");t.hidden=false;t.classList.remove("over");clearInterval(tInt);tick();tInt=setInterval(tick,250)}
function tick(){const left=Math.round((tEnd-Date.now())/1000);const t=$("#timer");
  if(left<=0){$("#tVal").textContent="0:00";if(!t.classList.contains("over")){t.classList.add("over");$("#tLbl").textContent="Dinlenme bitti. Sıradaki sete geç.";try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
    if(left<-8){clearInterval(tInt);t.hidden=true}return}
  $("#tVal").textContent=Math.floor(left/60)+":"+pad(left%60)}
$("#tPlus").onclick=()=>{tEnd=Math.max(tEnd,Date.now())+15000;$("#timer").classList.remove("over");clearInterval(tInt);tInt=setInterval(tick,250);tick()};
$("#tStop").onclick=()=>{clearInterval(tInt);$("#timer").hidden=true};

/* ---------- export/import ---------- */
function doExport(){flush();const data=JSON.stringify({exported:new Date().toISOString(),days:S.days,tests:S.tests,settings:S.settings},null,1);
  try{const u=URL.createObjectURL(new Blob([data],{type:"application/json"}));const a=document.createElement("a");a.href=u;a.download="hyrox-log-"+todayKey()+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
  catch(e){const b=$("#exportBox");if(b){b.hidden=false;b.value=data;b.select()}}}
function doImport(f){if(!f)return;const r=new FileReader();r.onload=async()=>{try{const j=JSON.parse(r.result);const ops=[];
  Object.entries(j.days||{}).forEach(([k,v])=>ops.push(write("days",k,v)));Object.entries(j.tests||{}).forEach(([k,v])=>ops.push(write("tests",k,v)));
  await Promise.all(ops);loadDraft();toast("İçe aktarıldı ✓");render()}catch(err){toast("Dosya okunamadı",true)}};r.readAsText(f)}

window.addEventListener("pagehide",flush);
document.addEventListener("visibilitychange",()=>{if(document.hidden)flush()});

/* ---------- boot ---------- */
lsLoad();loadDraft();render();updateNet();
pull();setInterval(()=>{if(!document.hidden)pull()},60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)pull()});
window.addEventListener("online",()=>{S.online=true;pull()});
window.addEventListener("offline",()=>{S.online=false;updateNet()});
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
